# Generated by `cplt init`. Review before trusting.
# Detected: JVM (Maven), Docker, Flyway

[propose]
# ⚠️  grants access to the Docker socket, effectively root on the host
# Suggested by: (root)
allow_docker = true
# Suggested by: (root)
allow_jvm_attach = true

[propose.allow]
localhost = [
    6432, # Postgres fra docker-compose.yml (DockerComposeTiltaksgjennomforingApplication)
    8080, # Applikasjonen (tiltaksgjennomforing-api)
    8081, # tiltak-refusjon lokalt, mottar fake-kafka fra TilskuddsperiodeFakeKafkaProducer (profil local)
    8090, # WireMock for eksterne tjenester (IntegrasjonerMockServer, profil wiremock og tester)
    9001, # Lokal kjøring av PDF-gen
]


## Machine-specific — these belong in ~/.config/cplt/config.toml, not here.
## Copy the [section] headers too: keys pasted at the end of that file are
## scoped by whichever header precedes them, which silently drops the grant.
