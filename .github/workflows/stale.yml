name: Lukk inaktive PR-er

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  stale:
    name: Merk og lukk inaktive PR-er
    runs-on: ubuntu-latest
    permissions:
      actions: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-issue-stale: -1
          days-before-issue-close: -1
          days-before-pr-stale: 14
          days-before-pr-close: 30
          stale-pr-label: wontfix
          exempt-pr-labels: pinned,security,dependencies
          stale-pr-message: >
            Denne PR-en har automatisk blitt markert som inaktiv fordi den ikke har hatt noen nylig aktivitet.
            Den vil bli lukket hvis det ikke blir foretatt noe mer aktivitet innen 30 dager.
            Takk for at du får saken din igjennom!
          close-pr-message: >
            Denne PR-en har nå blitt lukket pga. inaktivitet. Du kan fortsatt reåpne den.
